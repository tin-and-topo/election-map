name: Validate template

on:
  pull_request:
  push:
    branches: [main]

# Workflows only need repository contents to validate this template.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable revisions; Dependabot maintains these references.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install development dependencies
        run: .venv/bin/python -m pip install --upgrade pip && .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: .venv/bin/ruff check .
      - name: Check Python syntax
        run: .venv/bin/python -m compileall -q src scripts
      - name: Run tests when present
        run: |
          if [ -d tests ]; then .venv/bin/pytest -q; fi
